kind = "web"
previewPath = "/"
title = "Elite Portfolio"
description = "A sophisticated personal portfolio for a product-minded software engineer, showcasing selected work, technical range, and a direct path to connect."
version = "1.0.0"
id = "artifacts/elite-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19481

[services.development]
run = "pnpm --filter @workspace/elite-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/elite-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/elite-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19481"
BASE_PATH = "/"
